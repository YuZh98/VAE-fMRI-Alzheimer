name: lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lint + type tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check recvae/ tests/

      - name: Ruff format check
        run: ruff format --check recvae/ tests/

      - name: Mypy smoke check
        continue-on-error: true
        run: mypy --ignore-missing-imports --disable-error-code=import-untyped recvae/
