name: tutorials

on:
  schedule:
    # Nightly at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-demos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.11-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
          pip install -e ".[examples]"

      - name: Run every tutorial demo script
        env:
          TUTORIAL_THREADS: "2"
        run: |
          set -e
          shopt -s nullglob
          for f in tutorials/*/*.py tutorials/*/*/*.py; do
            base="$(basename "$f")"
            if [ "$base" = "_tutorial_utils.py" ] || [[ "$base" == _* ]]; then
              continue
            fi
            echo "==> $f"
            python "$f"
          done

      - name: Run every example script
        run: |
          set -e
          shopt -s nullglob
          for f in examples/*.py; do
            base="$(basename "$f")"
            if [[ "$base" == _* ]]; then
              continue
            fi
            echo "==> $f"
            python "$f"
          done
