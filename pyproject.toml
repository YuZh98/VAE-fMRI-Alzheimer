[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recvae"
version = "0.1.0"
description = "Recurrent VAE for temporal fMRI representation learning (Alzheimer's research)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Yu Zheng"}]
keywords = [
    "pytorch",
    "vae",
    "fmri",
    "neuroimaging",
    "alzheimers",
    "adni",
    "3d-cnn",
    "representation-learning",
    "medical-imaging",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
    "nibabel>=3.2",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "nbstripout>=0.6"]

[project.urls]
Repository = "https://github.com/YuZh98/VAE-fMRI-Alzheimer"
Issues = "https://github.com/YuZh98/VAE-fMRI-Alzheimer/issues"
Tutorials = "https://github.com/YuZh98/VAE-fMRI-Alzheimer/tree/main/tutorials"

[tool.setuptools.packages.find]
include = ["recvae*"]
exclude = ["tests*", "legacy*", "notebooks*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tutorials/**" = ["E402"]  # bootstrap shim before import
"examples/**" = ["E402"]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
